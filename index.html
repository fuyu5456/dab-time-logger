<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>DAB 测试时间记录</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    :root{
      --text:#e8eefc;
      --muted:#a9b6d3;
      --line:rgba(255,255,255,.08);
      --blue:#1677ff;
      --green:#2ecc71;
      --red:#ff4d4f;
      --amber:#faad14;
      --btn:#16233b;
      --btn2:#1b2a45;
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
      background:linear-gradient(180deg,#070c16,#0b1220 35%,#070c16);
      color:var(--text);
    }
    header{
      position:sticky; top:0;
      background:rgba(7,12,22,.86);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--line);
      padding:12px 14px;
      z-index:5;
    }
    header .title{ font-size:16px; font-weight:700; }
    header .sub{ font-size:12px; color:var(--muted); margin-top:4px; }

    .wrap{ padding:12px 14px 22px; max-width:520px; margin:0 auto; }
    .card{
      background:rgba(17,27,46,.9);
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      margin:10px 0;
    }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

    .mono{ font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace; }
    .muted{ color:var(--muted); font-size:12px; }
    .kv{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed rgba(255,255,255,.08); }
    .kv:last-child{ border-bottom:none; }
    .kv .k{ color:var(--muted); font-size:12px; }
    .kv .v{ font-size:12px; text-align:right; }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
      margin-top:10px;
    }
    button{
      appearance:none;
      border:none;
      border-radius:16px;
      padding:14px 12px;
      background:var(--btn);
      color:var(--text);
      font-weight:700;
      font-size:16px;
      box-shadow: 0 10px 22px rgba(0,0,0,.22);
    }
    button.secondary{ background:var(--btn2); }
    button.blue{ background:linear-gradient(180deg,#1f7bff,#0f5ed6); }
    button.green{ background:linear-gradient(180deg,#39d98a,#1ea864); }
    button.red{ background:linear-gradient(180deg,#ff6b6b,#e93b3d); }
    button.amber{ background:linear-gradient(180deg,#ffcc66,#faad14); color:#1b1406; }
    button:disabled{ opacity:.45; filter:saturate(.7); box-shadow:none; }

    .statePill{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid var(--line);
      font-size:12px;
      color:var(--muted);
    }
    .dot{ width:8px; height:8px; border-radius:99px; background:var(--muted); }
    .dot.on{ background:var(--green); }
    .dot.stutter{ background:var(--amber); }

    .toast{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:18px;
      background:rgba(0,0,0,.7);
      color:#fff;
      border:1px solid rgba(255,255,255,.12);
      padding:10px 12px;
      border-radius:12px;
      font-size:13px;
      max-width:92vw;
      z-index:10;
      display:none;
    }

    details summary{
      cursor:pointer;
      color:var(--text);
      font-weight:700;
      list-style:none;
    }
    details summary::-webkit-details-marker{ display:none; }
    table{ width:100%; border-collapse:collapse; margin-top:10px; }
    th,td{ padding:8px 6px; border-bottom:1px solid rgba(255,255,255,.08); text-align:left; font-size:12px; }
    th{ color:var(--muted); font-weight:700; }
    .btnSmall{
      padding:8px 10px;
      border-radius:12px;
      font-size:12px;
      font-weight:700;
      background:rgba(255,255,255,.08);
      box-shadow:none;
    }
    .btnSmall.danger{ background:rgba(255,77,79,.16); color:#ffd6d6; border:1px solid rgba(255,77,79,.25); }
    .btnSmall.blue{ background:rgba(22,119,255,.16); color:#d7e8ff; border:1px solid rgba(22,119,255,.25); }
  </style>
</head>

<body>
<header>
  <div class="title">DAB 测试时间记录（竖屏）</div>
  <div class="sub">单表导出：1 个 CSV 同时包含“总时长/总卡顿时长 + 每次事件 + 每次卡顿段信息”</div>
</header>

<div class="wrap">
  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <div class="statePill">
        <span id="dot" class="dot"></span>
        <span id="stateText">未开始</span>
      </div>
      <div class="statePill">
        <span id="dotSt" class="dot"></span>
        <span id="stText">未卡顿</span>
      </div>
    </div>

    <div id="sessionKV" style="margin-top:8px;"></div>

    <div class="grid">
      <button id="btnStart" class="green">开始测试</button>
      <button id="btnEnd" class="red" disabled>结束测试</button>

      <button id="btnStutterStart" class="amber" disabled>卡顿开始</button>
      <button id="btnStutterEnd" class="blue" disabled>卡顿结束</button>

      <button id="btnExport" class="secondary" disabled>导出 CSV（单表）</button>
      <button id="btnNew" class="secondary">新建会话</button>
    </div>

    <div class="muted" style="margin-top:10px;">
      总时长：START→END；未结束则 START→导出时刻（实时显示也按当前时间滚动）。<br/>
      总卡顿时长：只累计 PAIRED 的卡顿段。未配对事件仍会导出并标记。
    </div>
  </div>

  <div class="card">
    <details open>
      <summary>历史会话</summary>
      <div class="row" style="margin-top:10px;">
        <button id="btnRefresh" class="btnSmall">刷新</button>
        <button id="btnClearAll" class="btnSmall danger">清空全部历史</button>
      </div>
      <div id="history"></div>
    </details>
  </div>

  <div class="card">
    <details>
      <summary>当前会话事件预览</summary>
      <div id="preview" class="muted" style="margin-top:10px;"></div>
    </details>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(() => {
  const LS_KEY = "dab_time_logger_one_table_v1";
  const $ = (id) => document.getElementById(id);

  const state = { current: null, isStutterOngoing: false, lastClickAt: 0 };

  function debounceClick(ms=350){
    const now = Date.now();
    if (now - state.lastClickAt < ms) return false;
    state.lastClickAt = now;
    return true;
  }
  function toast(msg, ms=1400){
    const t = $("toast");
    t.textContent = msg;
    t.style.display = "block";
    clearTimeout(toast._timer);
    toast._timer = setTimeout(()=> t.style.display="none", ms);
  }
  function uuid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }
  function nowISO(){ return new Date().toISOString(); }
  function toLocalTime(iso){ return iso ? new Date(iso).toLocaleString() : ""; }
  function stamp(dateISO) {
    const d = new Date(dateISO);
    const pad = (n) => String(n).padStart(2,'0');
    return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  }

  function loadAll(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch { return []; } }
  function saveAll(sessions){ localStorage.setItem(LS_KEY, JSON.stringify(sessions)); }
  function upsertSession(session){
    const sessions = loadAll();
    const idx = sessions.findIndex(x => x.id === session.id);
    if (idx >= 0) sessions[idx] = session; else sessions.push(session);
    saveAll(sessions);
  }
  function deleteSession(id){ saveAll(loadAll().filter(x => x.id !== id)); }

  function startSession(){
    state.current = { id: uuid(), startedAt: nowISO(), endedAt: null, events: [] };
    state.isStutterOngoing = false;
    addEvent("START");
  }

  function addEvent(type){
    if(!state.current) return;
    const ev = { eventId: uuid(), sessionId: state.current.id, type, timestamp: nowISO() };
    state.current.events.push(ev);

    if (type === "STUTTER_START") state.isStutterOngoing = true;
    if (type === "STUTTER_END") state.isStutterOngoing = false;

    upsertSession(state.current);
    toast(`已记录：${type} @ ${new Date(ev.timestamp).toLocaleTimeString()}`);
    render();
  }

  function endSession(){
    if(!state.current) return;
    addEvent("END");
    state.current.endedAt = nowISO();
    upsertSession(state.current);
    render();
  }

  // 配对卡顿 + 生成“段”并把段信息挂到 start/end 事件上，便于单表导出
  function buildStutterModel(events){
    const sorted = [...(events||[])].sort((a,b)=> new Date(a.timestamp)-new Date(b.timestamp));

    // eventId -> {pairStatus, pairId}
    const eventPair = new Map();

    // eventId -> {stutterId, stutterStatus, stutterDurationSeconds, stutterRole}
    // stutterRole: START/END/ (空，非卡顿事件)
    const eventStutter = new Map();

    // 段列表（用于统计总卡顿等）
    const segments = [];

    const stack = [];

    const markUnpaired = (ev, role) => {
      eventPair.set(ev.eventId, {pairStatus:"UNPAIRED", pairId:""});
      eventStutter.set(ev.eventId, {
        stutterId: uuid(),
        stutterStatus: role === "START" ? "UNPAIRED_START_ONLY" : "UNPAIRED_END_ONLY",
        stutterDurationSeconds: "",
        stutterRole: role
      });
    };

    for(const ev of sorted){
      if(ev.type === "STUTTER_START"){
        stack.push(ev);
        // 先临时标记 unpaired start；如果后续配对会覆盖
        markUnpaired(ev, "START");
      } else if(ev.type === "STUTTER_END"){
        if(stack.length){
          const st = stack.pop();
          const stutterId = uuid();
          const duration = (new Date(ev.timestamp)-new Date(st.timestamp))/1000;

          eventPair.set(st.eventId, {pairStatus:"PAIRED", pairId: ev.eventId});
          eventPair.set(ev.eventId, {pairStatus:"PAIRED", pairId: st.eventId});

          eventStutter.set(st.eventId, {
            stutterId,
            stutterStatus: "PAIRED",
            stutterDurationSeconds: duration,
            stutterRole: "START"
          });
          eventStutter.set(ev.eventId, {
            stutterId,
            stutterStatus: "PAIRED",
            stutterDurationSeconds: duration,
            stutterRole: "END"
          });

          segments.push({ stutterId, durationSeconds: duration, status: "PAIRED" });
        } else {
          // 孤立 END
          markUnpaired(ev, "END");
          segments.push({ stutterId: eventStutter.get(ev.eventId).stutterId, durationSeconds: "", status: "UNPAIRED_END_ONLY" });
        }
      }
    }

    // 栈里剩余的 start 都是 UNPAIRED_START_ONLY（之前已经标记过）
    for(const st of stack){
      segments.push({ stutterId: eventStutter.get(st.eventId).stutterId, durationSeconds: "", status: "UNPAIRED_START_ONLY" });
    }

    return { sorted, eventPair, eventStutter, segments };
  }

  function computeTotals(session, segments, sortedEvents){
    const sorted = sortedEvents || (session.events||[]).slice().sort((a,b)=> new Date(a.timestamp)-new Date(b.timestamp));
    const startEv = sorted.find(e => e.type === "START");
    const endEv = [...sorted].reverse().find(e => e.type === "END");

    let totalDurationSeconds = "";
    if (startEv) {
      if (endEv) totalDurationSeconds = (new Date(endEv.timestamp)-new Date(startEv.timestamp))/1000;
      else totalDurationSeconds = (new Date() - new Date(startEv.timestamp))/1000; // 未结束：到当前时间
    }

    const totalStutterSeconds = segments
      .filter(s => s.status === "PAIRED" && typeof s.durationSeconds === "number")
      .reduce((sum, s) => sum + s.durationSeconds, 0);

    return { totalDurationSeconds, totalStutterSeconds };
  }

  function toCSV(rows, header){
    const esc = (v) => {
      const s = (v ?? "").toString();
      if (/[,"\n]/.test(s)) return `"${s.replaceAll('"','""')}"`;
      return s;
    };
    const lines = [ header.map(esc).join(",") ];
    for(const r of rows) lines.push(header.map(h => esc(r[h])).join(","));
    return lines.join("\n") + "\n";
  }

  function download(text, filename){
    const blob = new Blob([text], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // 单表导出：每行是一个事件（包含每次卡顿开始/结束事件），并带上汇总字段
  function exportSessionOneTable(session){
    const prefix = `${stamp(session.startedAt)}_${session.id.slice(0,8)}`;

    const { sorted, eventPair, eventStutter, segments } = buildStutterModel(session.events);
    const totals = computeTotals(session, segments, sorted);

    const stutterCountPaired = segments.filter(s => s.status === "PAIRED").length;
    const stutterCountUnpairedStartOnly = segments.filter(s => s.status === "UNPAIRED_START_ONLY").length;
    const stutterCountUnpairedEndOnly = segments.filter(s => s.status === "UNPAIRED_END_ONLY").length;

    const rows = sorted.map(ev => {
      const p = eventPair.get(ev.eventId) || {pairStatus:"", pairId:""};
      const st = eventStutter.get(ev.eventId) || {
        stutterId:"",
        stutterStatus:"",
        stutterDurationSeconds:"",
        stutterRole:""
      };

      return {
        // --- session summary fields (重复每行，方便Excel) ---
        sessionId: session.id,
        startedAt: session.startedAt,
        endedAt: session.endedAt || "",
        totalDurationSeconds: totals.totalDurationSeconds,
        totalStutterSeconds: totals.totalStutterSeconds,
        stutterCountPaired,
        stutterCountUnpairedStartOnly,
        stutterCountUnpairedEndOnly,
        eventCount: (session.events||[]).length,

        // --- event fields (每次事件记录) ---
        eventId: ev.eventId,
        eventType: ev.type,
        eventTimestamp: ev.timestamp,

        // --- pairing info (针对卡顿 start/end) ---
        pairStatus: p.pairStatus,
        pairId: p.pairId,

        // --- stutter segment info (如果该事件属于某段卡顿) ---
        stutterId: st.stutterId,
        stutterStatus: st.stutterStatus,
        stutterRole: st.stutterRole, // START or END
        stutterDurationSeconds: st.stutterDurationSeconds
      };
    });

    const header = [
      "sessionId","startedAt","endedAt",
      "totalDurationSeconds","totalStutterSeconds",
      "stutterCountPaired","stutterCountUnpairedStartOnly","stutterCountUnpairedEndOnly",
      "eventCount",
      "eventId","eventType","eventTimestamp",
      "pairStatus","pairId",
      "stutterId","stutterStatus","stutterRole","stutterDurationSeconds"
    ];

    const csv = toCSV(rows, header);
    download(csv, `dab_result_${prefix}.csv`);
    toast("已导出 1 个 CSV（单表）");
  }

  function render(){
    const inSession = !!state.current && !state.current.endedAt;

    $("dot").className = "dot" + (inSession ? " on" : "");
    $("stateText").textContent = inSession ? "测试中" : (state.current ? "已结束" : "未开始");

    $("dotSt").className = "dot" + (state.isStutterOngoing ? " stutter" : "");
    $("stText").textContent = state.isStutterOngoing ? "卡顿中" : "未卡顿";

    // session kv + 实时汇总预览
    const kv = $("sessionKV");
    if(!state.current){
      kv.innerHTML = `<div class="kv"><div class="k">当前会话</div><div class="v">无</div></div>`;
    } else {
      const s = state.current;
      const { sorted, segments } = buildStutterModel(s.events || []);
      const totals = computeTotals(s, segments, sorted);
      const fmt = (x) => (x === "" ? "" : Number(x).toFixed(1));

      kv.innerHTML = `
        <div class="kv"><div class="k">Session</div><div class="v mono">${s.id.slice(0,8)}</div></div>
        <div class="kv"><div class="k">开始</div><div class="v mono">${toLocalTime(s.startedAt)}</div></div>
        <div class="kv"><div class="k">结束</div><div class="v mono">${s.endedAt ? toLocalTime(s.endedAt) : ""}</div></div>
        <div class="kv"><div class="k">事件数</div><div class="v mono">${(s.events||[]).length}</div></div>
        <div class="kv"><div class="k">总时长(s)</div><div class="v mono">${fmt(totals.totalDurationSeconds)}</div></div>
        <div class="kv"><div class="k">卡顿总时长(s)</div><div class="v mono">${Number(totals.totalStutterSeconds).toFixed(1)}</div></div>
      `;
    }

    // buttons
    $("btnStart").disabled = inSession;
    $("btnEnd").disabled = !inSession;
    $("btnStutterStart").disabled = !inSession || state.isStutterOngoing;
    $("btnStutterEnd").disabled = !inSession;     // 允许孤立 END
    $("btnExport").disabled = !state.current;

    // preview
    const prev = $("preview");
    if(!state.current){
      prev.textContent = "无";
    } else {
      const es = state.current.events.slice(-12).reverse();
      prev.innerHTML = es.map(e => `<div class="mono">${e.type.padEnd(14," ")}  ${toLocalTime(e.timestamp)}</div>`).join("");
    }

    // history
    const list = loadAll().sort((a,b)=> new Date(b.startedAt)-new Date(a.startedAt));
    const h = $("history");
    if(!list.length){
      h.innerHTML = `<div class="muted" style="margin-top:10px;">暂无历史</div>`;
      return;
    }

    let html = `<table><thead><tr>
      <th>Session</th><th>开始</th><th>结束</th><th>事件</th><th>操作</th>
    </tr></thead><tbody>`;
    for(const s of list){
      html += `<tr>
        <td class="mono">${s.id.slice(0,8)}</td>
        <td class="mono">${toLocalTime(s.startedAt)}</td>
        <td class="mono">${toLocalTime(s.endedAt)}</td>
        <td>${(s.events||[]).length}</td>
        <td>
          <button class="btnSmall" data-act="load" data-id="${s.id}">载入</button>
          <button class="btnSmall blue" data-act="export" data-id="${s.id}">导出</button>
          <button class="btnSmall danger" data-act="delete" data-id="${s.id}">删除</button>
        </td>
      </tr>`;
    }
    html += `</tbody></table>`;
    h.innerHTML = html;

    h.querySelectorAll("button[data-act]").forEach(btn => {
      btn.onclick = () => {
        if(!debounceClick()) return;
        const id = btn.getAttribute("data-id");
        const act = btn.getAttribute("data-act");
        const sessions = loadAll();
        const s = sessions.find(x => x.id === id);
        if(!s) return;

        if(act === "load"){
          state.current = s;
          const last = (s.events||[]).filter(e => e.type==="STUTTER_START"||e.type==="STUTTER_END").slice(-1)[0];
          state.isStutterOngoing = last ? (last.type==="STUTTER_START") : false;
          toast(`已载入 Session ${s.id.slice(0,8)}`);
          render();
        } else if(act === "export"){
          exportSessionOneTable(s);
        } else if(act === "delete"){
          if(confirm("确认删除该会话？不可恢复。")){
            deleteSession(id);
            if(state.current?.id === id){ state.current = null; state.isStutterOngoing = false; }
            toast("已删除");
            render();
          }
        }
      };
    });
  }

  // actions
  $("btnStart").onclick = () => { if(debounceClick()) startSession(); };

  $("btnEnd").onclick = () => {
    if(!debounceClick()) return;
    const tip = state.isStutterOngoing
      ? "当前仍处于卡顿中，结束后会生成 UNPAIRED_START_ONLY。确认结束？"
      : "确认结束测试？";
    if(confirm(tip)) endSession();
  };

  $("btnStutterStart").onclick = () => { if(debounceClick()) addEvent("STUTTER_START"); };
  $("btnStutterEnd").onclick = () => { if(debounceClick()) addEvent("STUTTER_END"); };
  $("btnExport").onclick = () => { if(debounceClick() && state.current) exportSessionOneTable(state.current); };

  $("btnNew").onclick = () => {
    if(!debounceClick()) return;
    if(state.current && !state.current.endedAt){
      if(!confirm("当前会话仍在进行中，确定要新建？（不会自动结束当前会话）")) return;
    }
    state.current = null;
    state.isStutterOngoing = false;
    toast("可点击开始测试创建新会话");
    render();
  };

  $("btnRefresh").onclick = () => { if(debounceClick()) render(); };

  $("btnClearAll").onclick = () => {
    if(!debounceClick()) return;
    if(confirm("确认清空全部历史？不可恢复。")){
      localStorage.removeItem(LS_KEY);
      state.current = null;
      state.isStutterOngoing = false;
      toast("已清空");
      render();
    }
  };

  render();

  // 每 1 秒刷新一次总时长显示（仅在测试中）
  setInterval(() => {
    if (state.current && !state.current.endedAt) render();
  }, 1000);
})();
</script>
</body>
</html>
